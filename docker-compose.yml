services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rfid-uai-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U ${DB_USER} -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U ${DB_USER} -P "${DB_PASSWORD}" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = '${DB_NAME}') CREATE DATABASE ${DB_NAME}"

volumes:
  sqlserver_data: